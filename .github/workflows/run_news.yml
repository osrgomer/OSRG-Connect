name: Daily News Morning Runner

on:
  schedule:
    # 08:00 UTC is 08:00 AM in Lisbon (Winter Time)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update the news file in your repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Gemini Library
        run: pip install -U google-generativeai

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_bot.py

      - name: Update Repository
        run: |
          git config --global user.name "NewsBot"
          git config --global user.email "actions@github.com"
          git add global_news.html
          git commit -m "Daily News Update: $(date)" || exit 0
          git push
